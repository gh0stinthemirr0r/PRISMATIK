[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-contracts"
version = "0.1.0"
description = "Chart visualization contracts for PRISMATIK trading platform"
readme = "README.md"
requires-python = ">=3.9"
license.text = "MIT"
authors = [
    {name = "PRISMATIK Team", email = "dev@prismatik.dev"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.5.0",
    "attrs>=23.1.0",
]

[project.optional-dependencies]
development = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "mypy>=1.8.0",
]
