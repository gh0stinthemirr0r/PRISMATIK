# PRISMATIK cargo-deny configuration
# Wave 0 DoD criterion: deny.toml license allowlist + advisory policy, blocking in CI.
# Spec: DOCS/spec/CI_WORKFLOWS.md, DOCS/spec/SECURITY_THREAT_MODEL.md §9.1

[graph]
all-features = true

[advisories]
# Block on any known vulnerability.
version = 2
yanked = "deny"
ignore = [
    # Add advisory IDs here ONLY with an ADR recording the accepted risk and
    # the remediation timeline. A bare ignore is how security debt accumulates.
]

[licenses]
# Permissive only. Copyleft (GPL/AGPL) and Commons Clause forbidden in dependencies
# because PRISMATIK ships as a proprietary product.
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.93
exceptions = [
    # Ring uses a permissive license that cargo-deny sometimes classifies oddly.
    { allow = ["ISC", "MIT"], name = "ring" },
    # WebPki uses the same approach.
    { allow = ["ISC"], name = "webpki" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate crates are warnings unless explicitly allowed.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Forbidden crates by name.
    # - chrono: we use the `time` crate per DOCS/spec/CRATE_ARCHITECTURE.md
    { name = "chrono", reason = "use the `time` crate; chrono has murky CVE history" },
    # - OpenSSL: rustls-tls is the policy
    { name = "openssl", reason = "rustls-tls only" },
    { name = "openssl-sys", reason = "rustls-tls only" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
