[package]
name = "prismatik-server"
version = "0.1.0"
edition = "2021"
authors = ["Aaron Stovall"]
description = "Prismatik by Mythos Systems: quant research, paper trading, and gated live execution"
license = "Proprietary"
rust-version = "1.75"

[dependencies]
axum = { version = "=0.7.5", features = ["ws", "json"] }
tokio = { version = "=1.38.1", features = ["full"] }
tower-http = { version = "=0.5.2", features = ["fs"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "=0.23.1", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "=0.8.5"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.18", features = ["json", "env-filter"] }
thiserror = "1"
prismatik-determinism = { path = "../../crates/prismatik-determinism" }

[workspace]
