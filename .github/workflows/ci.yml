name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  reference-boundary:
    name: Native reference boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse production dependencies on references
        run: python3 scripts/reference_boundary.py

  fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  determinism-grep:
    name: Determinism guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determinism grep gate (Wave 0 DoD #1)
        run: python3 scripts/determinism_grep.py
      - name: Negative test — gate must fail on a violation (Wave 0 DoD #2)
        run: cargo test --package prismatik-determinism --test grep_gate

  bindings-drift:
    name: Bindings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash packages/api-client/scripts/check-bindings-drift.sh

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo test --workspace


  # apps/desktop/src-tauri is deliberately outside the root cargo workspace, so
  # `cargo test --workspace` above never touches it. Without this job the Tauri
  # shell — the only cross-platform surface in the repo — is compiled by CI on
  # no platform at all.
  desktop-app:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      # WebKitGTK and its build deps are preinstalled on macOS and Windows
      # runners but not on Ubuntu.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @prismatik/desktop check
      - name: Build frontend
        run: pnpm --filter @prismatik/desktop build
      # Not yet `-D warnings`: the shell carries 12 pre-existing warnings,
      # including two determinism-policy violations (SystemTime::now in
      # chat.rs and predictions.rs). Compilation and tests are the hard gate
      # until that debt is cleared; the warnings stay visible in the log.
      # The root `cargo fmt --all` job cannot see this crate either.
      - name: Format desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check
      - name: Clippy desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets
      - name: Test desktop shell
        working-directory: apps/desktop/src-tauri
        run: cargo test

  offline-market-data:
    name: Market data cassette tests (offline)
    runs-on: ubuntu-latest
    env:
      # Cassette tests must remain hermetic and must never require network access.
      PRISMATIK_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - run: cargo test -p prismatik-market-data

  registry-coverage:
    name: OSS registry coverage (P0-SS-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Every workspace member appears in component registry
        run: cargo test -p prismatik-oss-registry registry_coverage -- --nocapture

  calendar-cross-validation:
    name: Calendar QuantLib cross-validation (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Offline fixture oracle — QuantLib is not installed in this job.
      - name: Zero-tolerance calendar gate
        run: bash scripts/run-calendar-cross-validation.sh

  # P0-SS-06 / P0-SS-07 floor: refuse-invalid provenance (no cosign binary).
  updater-provenance:
    name: Updater refuse-invalid (P0-SS-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Offline updater negative tests
        run: cargo test -p prismatik-security updater -- --nocapture

  # P0-SS-06: SBOM script is best-effort; default CI must not require cargo-cyclonedx.
  sbom-generate:
    name: SBOM generate (P0-SS-06 optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Generate SBOM or document install
        run: bash scripts/generate-sbom.sh

  cargo-vet:
    name: Cargo vet (supply-chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      - name: cargo vet check (workspace)
        run: cargo vet check --locked
      - name: cargo vet check (trusted-core)
        run: bash scripts/cargo-vet-trusted-core.sh

  strategy-ir-python:
    name: StrategyIR Python emitter (P4-QM-15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python StrategyIR tests
        run: python services/research-sidecar/strategy_ir/test_strategy_ir.py -v

  dst-replay-256:
    name: DST replay 256 seeds (Wave 3 DoD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: dst_replay_suite_256
        run: cargo test -p prismatik-application dst_replay_suite_256 -- --nocapture
