[[permission]]
identifier = "allow-kronos-predict"
description = "Run Kronos K-line foundation model prediction."
commands.allow = ["kronos_predict"]

[[permission]]
identifier = "allow-kronos-batch-predict"
description = "Run Kronos batch prediction for multiple symbols."
commands.allow = ["kronos_batch_predict"]

[[permission]]
identifier = "allow-kronos-models"
description = "List available Kronos models."
commands.allow = ["kronos_models"]

[[permission]]
identifier = "allow-kronos-predict-from-market"
description = "Run Kronos prediction using live market data."
commands.allow = ["kronos_predict_from_market"]
