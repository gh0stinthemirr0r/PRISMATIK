[[permission]]
identifier = "allow-get-crypto-markets"
description = "Allows reading normalized crypto market quotes (cassette or live adapter)."
commands.allow = ["get_crypto_markets"]

[[permission]]
identifier = "allow-get-crypto-global"
description = "Allows reading crypto global market stats."
commands.allow = ["get_crypto_global"]

[[permission]]
identifier = "allow-get-crypto-trending"
description = "Allows reading trending crypto assets."
commands.allow = ["get_crypto_trending"]

[[permission]]
identifier = "allow-get-crypto-ohlc"
description = "Allows reading crypto OHLC candles for charts."
commands.allow = ["get_crypto_ohlc"]

[[permission]]
identifier = "allow-get-coin-detail"
description = "Allows reading a CoinGecko coin detail profile."
commands.allow = ["get_coin_detail"]

[[permission]]
identifier = "allow-get-crypto-categories"
description = "Allows reading crypto category map rows."
commands.allow = ["get_crypto_categories"]

[[permission]]
identifier = "allow-get-crypto-exchanges"
description = "Allows reading crypto exchange breadth."
commands.allow = ["get_crypto_exchanges"]

[[permission]]
identifier = "allow-search-crypto"
description = "Allows CoinGecko asset search from the command palette."
commands.allow = ["search_crypto"]

[[permission]]
identifier = "allow-get-rate-budget-state"
description = "Allows reading GCRA rate-budget snapshots."
commands.allow = ["get_rate_budget_state"]

[[permission]]
identifier = "allow-spend-rate-budget"
description = "Allows spending an interactive GCRA permit."
commands.allow = ["spend_rate_budget"]
