[[permission]]
identifier = "allow-ping"
description = "Allows the health ping command."
commands.allow = ["ping"]

[[permission]]
identifier = "allow-app-version"
description = "Allows reading the desktop package version."
commands.allow = ["app_version"]

[[permission]]
identifier = "allow-host-platform"
description = "Report the host operating system so the frontend can draw platform-correct window chrome."
commands.allow = ["host_platform"]
