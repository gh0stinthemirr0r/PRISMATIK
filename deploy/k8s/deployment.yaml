apiVersion: apps/v1
kind: Deployment
metadata:
  name: prismatik-api
  namespace: prismatik
  labels:
    app.kubernetes.io/name: prismatik-api
    app.kubernetes.io/part-of: prismatik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prismatik-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prismatik-api
        app.kubernetes.io/part-of: prismatik
    spec:
      containers:
        - name: prismatik-api
          # Placeholder — replace via author-ops before any prod apply.
          image: ghcr.io/prismatik/prismatik-api:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No Secret / ConfigMap mounts in this floor scaffold.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
